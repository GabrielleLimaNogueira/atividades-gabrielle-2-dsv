<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<link rel="stylesheet" href="bootstrap.css">
</head>

<body>
    <main class="containder bg-danger p-3"></main>
    <nav class="navbar navbar-expand-lg bg-secondary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">📚study</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>

                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>
    <div id="carouselExampleCaptions" class="carousel slide">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"
                aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2"
                aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
              
              <a href="https://www.youtube.com/channel/UCIak6JLVOjqhStxrL1Lcytw"> <img src="gunsnroses.jpg"   width="500" height="500" class="d-block w-100" alt="...">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Guns N Roses</h5>
                    <p>um rock para escutar 🤘❤️</p>
                    </a>
                </div>
            </div>
            <div class="carousel-item">
              
              <img src="download.jpg"  width="500" height="500"  class="d-block w-100" alt="...">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Forró Boys</h5>
                   <a href="https://www.youtube.com/@grupoforroboys"> 
                    <p>Ouça forró clicando aqui!</p>

                </a>  
                </div>
            </div>
            <div class="carousel-item">
                <img src="..." class="d-block w-100" alt="...">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Third slide label</h5>
                    <p>Some representative placeholder content for the third slide.</p>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions"
            data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <!-- container - div 80% largura centralizADA -->
    <!-- container-fluid - div 100% largura -->
    <!-- bg-color - cor de background -->
    <!-- p - padding (1 a 5, top, bottom , end , start, y , x) -->
    <!-- m - margem (1 a 5, top, bottom , end , start, y , x) -->


   <script src="bootstrap.js"></script>
</body>

</html>
